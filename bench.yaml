# Minimal configuration for bench testing over USB.
# No Wi-Fi/API/OTA - logs go over the serial port.
# The BOOT button (GPIO0) on the board toggles the lamp on/off (phase 3, live test).
# Flash with: esphome run bench.yaml
#
# Needs secrets.yaml (it is in .gitignore) with your remote's ID/route:
#   emotion_remote_id: "68049F25"
# Compact example: "68ABF2". Find your value with sniffer.yaml.

esphome:
  name: emotion-bench

esp32:
  board: esp32dev          # suitable for the ESP32 DevKit V1 (ESP-WROOM-32)

logger:
  level: DEBUG

external_components:
  - source:
      type: local
      path: components

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

cc2500_emotion:
  id: emotion
  cs_pin: GPIO5
  gdo0_pin: GPIO4
  remote_id: !secret emotion_remote_id

globals:
  - id: lamp_on
    type: bool
    restore_value: no
    initial_value: "false"

binary_sensor:
  - platform: gpio
    name: "Boot Button"
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true          # BOOT pulls to GND -> pressed = true
    filters:
      - delayed_on: 50ms       # debounce
    on_press:
      then:
        - lambda: |-
            if (id(lamp_on)) {
              id(emotion).send_off();
              id(lamp_on) = false;
            } else {
              id(emotion).send_on(0x80);   // turn on at mid color temperature
              id(lamp_on) = true;
            }
