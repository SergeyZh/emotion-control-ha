# Production config: an L&S light in Home Assistant via ESP32 + CC2500.
# Needs secrets.yaml with wifi_ssid / wifi_password. Flash with: esphome run example.yaml

esphome:
  name: emotion-control

esp32:
  board: esp32dev          # ESP32 DevKit V1 (ESP-WROOM-32)

logger:
  level: DEBUG

# To encrypt the Home Assistant connection, add an `encryption:` block here with
# a 32-byte base64 key and put that key into secrets.yaml.
api:

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: On
  output_power: 9

external_components:
  - source: github://SergeyZh/emotion-control-ha/
    refresh: 0s
    components: [ cc2500_emotion, cc2500_emotion_sniffer ]

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

cc2500_emotion:
  id: emotion
  cs_pin: GPIO5
  gdo0_pin: GPIO4
  # Your remote's ID, 4 bytes hex. Required for transmitting; without it the
  # device only listens to the air. To find your remote's ID, flash sniffer.yaml
  # and press any button on it.
  remote_id: !secret emotion_remote_id
  # remote_id: "00000000"

# Listening to the air. Does not affect lamp control - it only logs frames and
# fills the entity listing discovered remotes (below).
cc2500_emotion_sniffer:
  id: sniffer
  cc2500_emotion_id: emotion
  # An event onto the Home Assistant bus for EVERY press of any remote in range
  # (repeats within a burst are not duplicated). A live air table is built from
  # this in HA - recipe in SNIFFER.md, section "A live air table in Home Assistant".
  on_frame:
    - homeassistant.event:
        event: esphome.emotion_frame
        variables:
          rid: !lambda "return remote_id;"
          cmd: !lambda "return command;"
          cname: !lambda "return command_name;"
          val: !lambda "return value;"
          sig: !lambda "return rssi;"
        data_template:
          remote_id: "{{ rid }}"
          command: "{{ cmd }}"
          command_name: "{{ cname }}"
          value: "{{ val }}"
          rssi: "{{ sig }}"

text_sensor:
  # Every remote heard since boot, each with its best signal level.
  # Your own remote is the one with the stronger signal: "6804F74D -49dBm, 68049F25 -71dBm".
  - platform: cc2500_emotion_sniffer
    cc2500_emotion_sniffer_id: sniffer
    discovered_remotes:
      name: "Discovered remotes"

light:
  - platform: cc2500_emotion
    name: "L&S Emotion"
    cc2500_emotion_id: emotion
    # Color temperature range (optional; defaults to 6500K..2700K):
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2700 K
    # Number of brightness levels the lamp has (L&S = 5):
    brightness_levels: 5

button:
  # Pairing: put the lamp into learning mode, then press this button.
  - platform: template
    name: "Pair"
    on_press:
      lambda: "id(emotion).send_pair();"

  # Brightness steps (they update both Home Assistant state and the lamp).
  - platform: template
    name: "Brighter"
    on_press:
      lambda: "id(emotion).brightness_step(1);"
  - platform: template
    name: "Dimmer"
    on_press:
      lambda: "id(emotion).brightness_step(-1);"

  # Raw command: cmd and value are typed straight into Home Assistant (fields
  # below), no reflashing. Handy for hunting an absolute-brightness command -
  # enter cmd/value and hit "Raw send".
  - platform: template
    name: "Raw send"
    on_press:
      lambda: |-
        uint8_t cmd = (uint8_t) strtol(id(raw_cmd).state.c_str(), nullptr, 16);
        uint8_t val = (uint8_t) strtol(id(raw_val).state.c_str(), nullptr, 16);
        ESP_LOGI("raw", "send_raw(0x%02X, 0x%02X)", cmd, val);
        id(emotion).send_raw(cmd, val);

# Fields editable from Home Assistant for "Raw send" (hex, e.g. 0x11 or just 11).
text:
  - platform: template
    name: "Raw cmd (hex)"
    id: raw_cmd
    optimistic: true
    restore_value: true
    initial_value: "0x11"
    mode: text
    max_length: 4
  - platform: template
    name: "Raw value (hex)"
    id: raw_val
    optimistic: true
    restore_value: true
    initial_value: "0x00"
    mode: text
    max_length: 4
