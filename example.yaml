# Боевой конфиг: светильник L&S в Home Assistant через ESP32 + CC2500.
# Нужен secrets.yaml с wifi_ssid / wifi_password. Прошивка: esphome run example.yaml

esphome:
  name: emotion-control

esp32:
  board: esp32dev          # ESP32 DevKit V1 (ESP-WROOM-32)

logger:
  level: DEBUG

api:
ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: On
  output_power: 9

external_components:
  - source:
      type: local
      path: components

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

cc2500_emotion:
  id: emotion
  cs_pin: GPIO5
  gdo0_pin: GPIO4
  # ID вашего пульта, 4 байта hex. Обязателен для передачи; без него устройство
  # только слушает эфир. Узнать ID своего пульта — прошить sniffer.yaml и нажать
  # на нём любую кнопку.
  remote_id: !secret emotion_remote_id
  # remote_id: "00000000"

# Прослушивание эфира. Не влияет на управление лампой — только логирует кадры
# и наполняет сущность со списком найденных пультов (ниже).
cc2500_emotion_sniffer:
  id: sniffer
  cc2500_emotion_id: emotion
  # Событие в шину Home Assistant на КАЖДОЕ нажатие любого пульта в радиусе приёма
  # (повторы серии не дублируются). Из этого в HA строится живая таблица эфира —
  # рецепт в README, раздел «Таблица эфира в Home Assistant».
  on_frame:
    - homeassistant.event:
        event: esphome.emotion_frame
        variables:
          rid: !lambda "return remote_id;"
          cmd: !lambda "return command;"
          cname: !lambda "return command_name;"
          val: !lambda "return value;"
          sig: !lambda "return rssi;"
        data_template:
          remote_id: "{{ rid }}"
          command: "{{ cmd }}"
          command_name: "{{ cname }}"
          value: "{{ val }}"
          rssi: "{{ sig }}"

text_sensor:
  # Все пульты, услышанные с момента загрузки, с лучшим уровнем сигнала каждого.
  # Свой пульт — тот, у которого сигнал сильнее: "6804F74D -49dBm, 68049F25 -71dBm".
  - platform: cc2500_emotion_sniffer
    cc2500_emotion_sniffer_id: sniffer
    discovered_remotes:
      name: "Найденные пульты"

light:
  - platform: cc2500_emotion
    name: "L&S Emotion"
    cc2500_emotion_id: emotion
    # Диапазон цветовой температуры (по желанию; дефолт 6500K..2700K):
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2700 K
    # Число ступеней яркости лампы (L&S = 5):
    brightness_levels: 5

button:
  # Сопряжение: лампу в режим обучения, затем нажать эту кнопку.
  - platform: template
    name: "Сопряжение"
    on_press:
      lambda: "id(emotion).send_pair();"

  # Шаги яркости (обновляют и состояние в HA, и лампу).
  - platform: template
    name: "Ярче"
    on_press:
      lambda: "id(emotion).brightness_step(1);"
  - platform: template
    name: "Темнее"
    on_press:
      lambda: "id(emotion).brightness_step(-1);"

  # «Сырая» команда: cmd и value задаются прямо в HA (поля ниже), без перепрошивки.
  # Удобно искать команду абсолютной яркости — впиши cmd/value и жми «Raw send».
  - platform: template
    name: "Raw send"
    on_press:
      lambda: |-
        uint8_t cmd = (uint8_t) strtol(id(raw_cmd).state.c_str(), nullptr, 16);
        uint8_t val = (uint8_t) strtol(id(raw_val).state.c_str(), nullptr, 16);
        ESP_LOGI("raw", "send_raw(0x%02X, 0x%02X)", cmd, val);
        id(emotion).send_raw(cmd, val);

# Редактируемые из HA поля для «Raw send» (hex, напр. 0x11 или просто 11).
text:
  - platform: template
    name: "Raw cmd (hex)"
    id: raw_cmd
    optimistic: true
    restore_value: true
    initial_value: "0x11"
    mode: text
    max_length: 4
  - platform: template
    name: "Raw value (hex)"
    id: raw_val
    optimistic: true
    restore_value: true
    initial_value: "0x00"
    mode: text
    max_length: 4
